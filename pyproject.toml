[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pka"
version = "1.0.0"
description = "Alexandria — local-first research library"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    # Core
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "chromadb>=0.5",
    "httpx>=0.27",

    # Document extraction
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "ebooklib>=0.18",
    "trafilatura>=1.9",

    # Clustering
    "numpy>=1.26",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "scikit-learn>=1.3",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Images
    "Pillow>=10",
    "easyocr>=1.7",              # deep-learning OCR (torch-backed; no system binary)
    "transformers>=4.40",        # CLIP
    "torch>=2.2",                # CPU build is fine
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff",
    "mypy",
]
spacy = [
    "spacy>=3.7",                # optional sentence splitter backend
]
youtube = [
    # Saved-video connector (YouTube Data API v3). Opt-in so the core install
    # stays local-first; the connector is inert without these + OAuth creds.
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
alexandria = "pka.cli:main"

[tool.setuptools.packages.find]
include = ["pka*"]
exclude = ["tests*", "frontend*", "scripts*"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode     = "auto"
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["pka"]
omit   = [
    "pka/db/alembic/*",
    "scripts/*",
    "pka/cli/*",           # thin CLI wrappers around library code (like scripts/)
    "pka/pipeline.py",
    "pka/db/init_db.py",
]

[tool.coverage.report]
show_missing = true
skip_empty   = true
fail_under   = 85

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]                   # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection style relies on `Depends(...)` / `Query(...)`
# calls in argument defaults, which B008 flags by design.
"pka/api/routers/*" = ["B008"]
