[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pka"
version = "0.2.0"
description = "Personal Knowledge Archive — local-first research library"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    # Core
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "chromadb>=0.5",
    "httpx>=0.27",

    # Document extraction
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "ebooklib>=0.18",
    "trafilatura>=1.9",

    # Clustering
    "numpy>=1.26",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "scikit-learn>=1.3",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Images
    "Pillow>=10",
    "pytesseract>=0.3",          # requires the Tesseract binary on PATH
    "transformers>=4.40",        # CLIP
    "torch>=2.2",                # CPU build is fine
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff",
    "mypy",
]
spacy = [
    "spacy>=3.7",                # optional sentence splitter backend
]

[project.scripts]
pka-init        = "scripts.init_db:__main__"
pka-zotero      = "scripts.run_zotero:main"
pka-firefox     = "scripts.run_firefox:main"
pka-calibre     = "scripts.run_calibre:main"
pka-images      = "scripts.run_images:main"
pka-clustering  = "scripts.run_clustering:main"

[tool.setuptools.packages.find]
include = ["pka*"]
exclude = ["tests*", "frontend*", "scripts*"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode     = "auto"
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["pka"]
omit   = ["pka/db/alembic/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_empty   = true

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]                   # line length handled by formatter
