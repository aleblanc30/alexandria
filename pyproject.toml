[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pka"
version = "0.0.11"
description = "Alexandria — local-first research library"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    # Core
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3",  # the chunk embedding model (embedding_model)
    "semantic-text-splitter>=0.33",  # chunk_text: token-sized chunks on sentence bounds
    "pysbd>=0.3.4",              # split_sentences: trimming summaries and synopses
    "httpx>=0.27",

    # Document extraction
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "ebooklib>=0.18",
    "trafilatura>=1.9",
    # Arrives with trafilatura and readability-lxml, but fetch_base imports it
    # directly to strip markup, so it is declared rather than assumed.
    "lxml>=5",

    # Clustering
    "numpy>=1.26",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "scikit-learn>=1.3",
    "scipy>=1.11",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Images
    "Pillow>=10",
    "easyocr>=1.7",              # deep-learning OCR (torch-backed; no system binary)
    "transformers>=4.40",        # CLIP
    "torch>=2.2",                # CPU build is fine
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-xdist>=3",            # scripts/check.* runs the suite with -n 4; without
                                   # this the gate fails on "unrecognized arguments: -n"
    "ruff==0.15.17",              # pinned: the formatter's style rules change between
                                   # versions, and an unpinned ruff silently re-drifts
                                   # the whole tree the next time someone installs fresh
    "mypy",
    "import-linter>=2.1",        # `lint-imports`: the layering contract below
]
youtube = [
    # Saved-video connector (YouTube Data API v3). Opt-in so the core install
    # stays local-first; the connector is inert without these + OAuth creds.
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
alexandria = "pka.cli:main"

[tool.setuptools.packages.find]
include = ["pka*"]
exclude = ["tests*", "frontend*", "scripts*"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode     = "auto"
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["pka"]
omit   = [
    "pka/db/alembic/*",
    "scripts/*",
    "pka/cli/*",           # thin CLI wrappers around library code (like scripts/)
    "pka/db/init_db.py",
]

[tool.coverage.report]
show_missing = true
skip_empty   = true
fail_under   = 85

# ── mypy ──────────────────────────────────────────────────────────────────────
# Not run in CI; `mypy pka` is a manual step in the CLAUDE.md verify table and
# scripts/check.*. Baseline-ratcheted, not strict: the modules below had
# pre-existing errors when this config was added and are frozen via
# `ignore_errors` so the gate is "no new errors", not "fix 89 errors first".
# Shrink this list as a module gets cleaned up; do not add to it.
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pka.api.db_rows",
    "pka.api.document_serialize",
    "pka.api.routers.clusters",
    "pka.api.routers.search",
    "pka.config",
    "pka.db.browse",
    "pka.db.documents",
    "pka.db.tags",
    "pka.ingestion.firefox_sync",
    "pka.ingestion.image_extractor",
    "pka.ingestion.image_pipeline",
    "pka.ingestion.loops",
    "pka.ingestion.runners.calibre",
    "pka.ingestion.runners.firefox",
    "pka.ingestion.runners.reddit",
    "pka.ingestion.runners.youtube",
    "pka.ingestion.runners.zotero",
    "pka.ingestion.youtube_bookmark",
    "pka.providers.clip",
    "pka.storage.vector_store",
    "pka.tag_training.lifecycle",
    "pka.tag_training.llm_classifier",
]
ignore_errors = true

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001/S110/S112 are a ratchet: a blind `except Exception`, and
# especially a silent `pass` or `continue` under one, is allowed only where it
# is deliberate and says so. Every existing site was reviewed and carries either
# a narrowed exception type, a log line, or a `# noqa: BLE001 - <why>`, so a new
# unannotated one is a lint failure rather than a thing to find later.
# ARG001 likewise: every unused argument in pka/ and scripts/ was either removed
# or renamed with a leading underscore where a caller's signature requires it.
select = ["E", "F", "I", "B", "UP", "BLE001", "S110", "S112", "ARG001"]
ignore = ["E501"]                   # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection style relies on `Depends(...)` / `Query(...)`
# calls in argument defaults, which B008 flags by design.
"pka/api/routers/*" = ["B008"]
# Test doubles and fixtures match the signature they stand in for, so an unused
# argument there is the point, not a leftover.
"tests/**" = ["ARG001"]

# Import layering, enforced by `lint-imports` (scripts/check.*). A package may
# import only from layers below it; `a | b` siblings may not import each other.
# `exhaustive` means a new top-level module fails until it is placed here.
# Ingestion calls into clustering (the doc-embedding refresh, overlay tags),
# never the reverse; tag training sits above both and reaches the ingest tail
# only through `pka.hooks`, wired up by `pka.bootstrap`.
[tool.importlinter]
root_package = "pka"

[[tool.importlinter.contracts]]
name = "pka layering"
type = "layers"
containers = ["pka"]
exhaustive = true
layers = [
    "api | cli",
    "bootstrap | reembed",
    "purge | trends | domains | tag_training",
    "ingestion",
    "classification | enrichment_runs | clustering",
    "connectors | storage | ollama_chat",
    "providers",
    "db",
    "card_summary | json_utils",
    "config | constants | hooks",
]
# Baseline: imports that break the layering today. This list only shrinks —
# remove an entry when its import is fixed; never add one to get a green run.
ignore_imports = [
    # classification is below ingestion but takes extract_domain from domains
    "pka.classification -> pka.domains",
    # enrichment_runs is below ingestion but looks up summary settings there
    "pka.enrichment_runs -> pka.ingestion.summarize",
    # api reuses CLI modules for logging setup and two purge implementations
    "pka.api.main -> pka.cli._logging",
    "pka.api.routers.ingestion_purge -> pka.cli.purge_source",
    "pka.api.routers.runs -> pka.cli.purge_cluster_runs",
    # enrich and rechunk share purge's body_chunk_predicate
    "pka.ingestion.enrich -> pka.purge",
    "pka.ingestion.rechunk -> pka.purge",
    # the purge registry's cluster-run target lives in the CLI
    "pka.purge -> pka.cli.purge_cluster_runs",
    # the VLM OCR provider borrows the image extractor's encoder
    "pka.providers.vlm_ocr -> pka.ingestion.image_extractor",
]
